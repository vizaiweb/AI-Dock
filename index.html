<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 模型收藏夾</title>
<style>
/* ============ 主題變數 ============ */
:root {
  --bg: #f0f4f8;
  --bg-gradient: linear-gradient(145deg, #eef4f9 0%, #e2ebf3 100%);
  --card-bg: rgba(255, 255, 255, 0.75);
  --card-bg-hover: rgba(255, 255, 255, 0.95);
  --card-border: rgba(255, 255, 255, 0.9);
  --card-border-hover: rgba(160, 190, 215, 0.6);
  --text-primary: #1a3a4f;
  --text-secondary: #6b8698;
  --text-muted: #98aebb;
  --input-bg: rgba(255, 255, 255, 0.9);
  --input-border: #d4e2ec;
  --accent: #2d6b8f;
  --accent-hover: #1d4a64;
  --shadow: 0 10px 30px -10px rgba(30, 70, 100, 0.15);
  --shadow-hover: 0 18px 40px -12px rgba(30, 70, 100, 0.28);
  --divider: #d9e7f0;
  --danger: #c05a5a;
}

[data-theme="dark"] {
  --bg: #0a0e1a;
  --bg-gradient: radial-gradient(ellipse at top, #141b2d 0%, #0a0e1a 70%);
  --card-bg: rgba(28, 36, 56, 0.7);
  --card-bg-hover: rgba(38, 48, 72, 0.9);
  --card-border: rgba(70, 90, 130, 0.35);
  --card-border-hover: rgba(120, 160, 220, 0.6);
  --text-primary: #e8f0f8;
  --text-secondary: #94aec6;
  --text-muted: #647a90;
  --input-bg: rgba(24, 32, 50, 0.85);
  --input-border: #2a3854;
  --accent: #5b9bd5;
  --accent-hover: #7ab0e0;
  --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
  --shadow-hover: 0 18px 40px -12px rgba(90, 155, 213, 0.35);
  --divider: #223049;
  --danger: #e07070;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  min-height: 100vh;
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-primary);
  transition: background 0.4s ease, color 0.3s ease;
  padding: 2rem 1.5rem 4rem;
}

/* ============ 頂部工具列 ============ */
.topbar {
  max-width: 1200px;
  margin: 0 auto 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.title-block h1 {
  font-size: 1.9rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.title-block h1 .logo-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
  animation: pulse 2.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}

.title-block p {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin-top: 0.3rem;
}

.toolbar {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  align-items: center;
}

.btn {
  border: 1px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text-primary);
  padding: 0.55rem 1rem;
  border-radius: 40px;
  font-size: 0.85rem;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-family: inherit;
}

.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}

.btn:active { transform: translateY(0); }

.btn.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.btn.primary:hover {
  background: var(--accent-hover);
  color: white;
}

.btn.active-mode {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.btn-icon {
  padding: 0.55rem;
  width: 2.4rem;
  justify-content: center;
}

/* ============ 搜尋列 ============ */
.search-wrap {
  max-width: 1200px;
  margin: 0 auto 1.5rem;
  position: relative;
}

.search-wrap input {
  width: 100%;
  padding: 0.85rem 1.2rem 0.85rem 3rem;
  border-radius: 50px;
  border: 1px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text-primary);
  font-size: 0.95rem;
  outline: none;
  transition: all 0.2s;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-family: inherit;
}

.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(45, 107, 143, 0.12);
}

.search-wrap input::placeholder { color: var(--text-muted); }

.search-wrap .search-icon {
  position: absolute;
  left: 1.1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
  font-size: 1rem;
}

/* ============ 卡片網格 ============ */
.grid {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 1.2rem;
}

/* ============ 卡片 ============ */
.card {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 1.5rem;
  padding: 1.6rem 1rem 1.2rem;
  text-align: center;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2),
              box-shadow 0.25s ease,
              border-color 0.25s,
              background 0.25s;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
  animation: cardIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1) backwards;
  user-select: none;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-hover);
  border-color: var(--card-border-hover);
  background: var(--card-bg-hover);
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 1.5rem;
  padding: 1.5px;
  background: linear-gradient(135deg, transparent 40%, var(--brand-color, transparent) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.card:hover::before { opacity: 0.7; }

/* 圖標 */
.card-icon {
  width: 64px;
  height: 64px;
  border-radius: 22%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.9rem;
  font-weight: 600;
  color: white;
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.4);
  flex-shrink: 0;
  box-shadow: 0 6px 16px -6px rgba(0,0,0,0.25);
}

.card:hover .card-icon { transform: scale(1.08) rotate(-3deg); }

.card-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 名稱 */
.card-name {
  font-size: 1rem;
  font-weight: 650;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  line-height: 1.2;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 短句形容詞 */
.card-tagline {
  font-size: 0.78rem;
  color: var(--text-secondary);
  font-weight: 450;
  line-height: 1.35;
  letter-spacing: 0.1px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 2.1em;
}

/* ============ 編輯模式 ============ */
body.edit-mode .card {
  cursor: grab;
  padding-top: 2.4rem;
}

body.edit-mode .card:active { cursor: grabbing; }

body.edit-mode .card-icon { pointer-events: none; }

.card-edit-actions {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  display: none;
  gap: 0.25rem;
  z-index: 3;
}

body.edit-mode .card-edit-actions { display: flex; }

.card-edit-actions button {
  width: 1.9rem;
  height: 1.9rem;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.9);
  color: var(--text-secondary);
  font-size: 0.85rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

[data-theme="dark"] .card-edit-actions button {
  background: rgba(40, 50, 70, 0.9);
  color: var(--text-secondary);
}

.card-edit-actions button:hover {
  background: var(--accent);
  color: white;
  transform: scale(1.1);
}

.card-edit-actions button.danger:hover {
  background: var(--danger);
}

/* 拖拽狀態 */
.card.dragging {
  opacity: 0.35;
  transform: scale(0.95) rotate(2deg);
  cursor: grabbing !important;
}

.card.drag-over {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent) inset;
  transform: scale(1.02);
}

/* ============ 新增卡片按鈕 ============ */
.add-card {
  background: transparent;
  border: 2px dashed var(--input-border);
  border-radius: 1.5rem;
  padding: 1.6rem 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.2s;
  min-height: 180px;
  font-family: inherit;
}

.add-card:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(45, 107, 143, 0.05);
  transform: translateY(-3px);
}

.add-card .plus {
  font-size: 2rem;
  font-weight: 300;
  line-height: 1;
}

.add-card span {
  font-size: 0.85rem;
  font-weight: 500;
}

/* ============ 空狀態 ============ */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 4rem 1rem;
  color: var(--text-muted);
}

.empty-state .emoji {
  font-size: 3rem;
  display: block;
  margin-bottom: 1rem;
  opacity: 0.6;
}

/* ============ 模態框 ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 20, 30, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 1.5rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}

.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: var(--card-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--card-border);
  border-radius: 1.8rem;
  padding: 2rem;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4);
  transform: scale(0.94);
  transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}

.modal-overlay.show .modal { transform: scale(1); }

.modal h2 {
  font-size: 1.3rem;
  font-weight: 650;
  margin-bottom: 1.5rem;
  color: var(--text-primary);
}

.form-group {
  margin-bottom: 1rem;
}

.form-group label {
  display: block;
  font-size: 0.8rem;
  color: var(--text-secondary);
  font-weight: 550;
  margin-bottom: 0.4rem;
  letter-spacing: 0.2px;
}

.form-group input {
  width: 100%;
  padding: 0.7rem 0.9rem;
  border-radius: 12px;
  border: 1px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text-primary);
  font-size: 0.9rem;
  outline: none;
  transition: all 0.15s;
  font-family: inherit;
}

.form-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(45, 107, 143, 0.15);
}

.form-group .hint {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-top: 0.3rem;
}

.modal-actions {
  display: flex;
  gap: 0.6rem;
  justify-content: flex-end;
  margin-top: 1.6rem;
}

.color-picker-row {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.color-swatch {
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
}

.color-swatch:hover { transform: scale(1.12); }

.color-swatch.selected {
  border-color: var(--text-primary);
  transform: scale(1.15);
}

/* ============ 隱藏檔案輸入 ============ */
#fileInput { display: none; }

/* ============ 響應式 ============ */
@media (max-width: 600px) {
  body { padding: 1.2rem 1rem 3rem; }
  .title-block h1 { font-size: 1.5rem; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.9rem; }
  .card { padding: 1.2rem 0.7rem 1rem; border-radius: 1.2rem; }
  .card-icon { width: 52px; height: 52px; font-size: 1.5rem; }
  .card-name { font-size: 0.9rem; }
  .card-tagline { font-size: 0.72rem; }
  .btn span.label { display: none; }
  .btn { padding: 0.55rem 0.7rem; }
}
</style>
</head>
<body data-theme="light">

<!-- ============ 頂部 ============ -->
<div class="topbar">
  <div class="title-block">
    <h1><span class="logo-dot"></span>AI 模型收藏夾</h1>
    <p>點擊卡片開啟 · 支援拖拽排序 · 資料自動保存</p>
  </div>
  <div class="toolbar">
    <button class="btn" id="editToggle" title="切換編輯模式">
      <span>✎</span><span class="label">編輯</span>
    </button>
    <button class="btn" id="exportBtn" title="匯出 JSON">
      <span>↓</span><span class="label">匯出</span>
    </button>
    <button class="btn" id="importBtn" title="匯入 JSON">
      <span>↑</span><span class="label">匯入</span>
    </button>
    <button class="btn btn-icon" id="themeToggle" title="切換主題">
      <span id="themeIcon">🌙</span>
    </button>
  </div>
</div>

<!-- ============ 搜尋 ============ -->
<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input type="text" id="searchInput" placeholder="搜尋模型名稱或功能描述...">
</div>

<!-- ============ 卡片網格 ============ -->
<div class="grid" id="grid"></div>

<!-- ============ 編輯/新增模態框 ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">新增模型</h2>
    <form id="modelForm">
      <div class="form-group">
        <label>名稱 *</label>
        <input type="text" id="fieldName" required maxlength="30" placeholder="例如：ChatGPT">
      </div>
      <div class="form-group">
        <label>功能描述（短句）*</label>
        <input type="text" id="fieldTagline" required maxlength="40" placeholder="例如：全能對話助理">
      </div>
      <div class="form-group">
        <label>連結 URL *</label>
        <input type="url" id="fieldUrl" required placeholder="https://...">
      </div>
      <div class="form-group">
        <label>圖標 URL（可選）</label>
        <input type="url" id="fieldIcon" placeholder="留空將自動使用網站 favicon">
        <div class="hint">留空會自動抓取該網站的 favicon</div>
      </div>
      <div class="form-group">
        <label>品牌顏色</label>
        <div class="color-picker-row" id="colorPicker"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="cancelBtn">取消</button>
        <button type="submit" class="btn primary" id="saveBtn">儲存</button>
      </div>
    </form>
  </div>
</div>

<input type="file" id="fileInput" accept=".json,application/json">

<script>
(function() {
  'use strict';

  /* ============================================================
     1. 常數與預設資料
  ============================================================ */
  const STORAGE_KEY = 'ai_collection_data_v1';
  const THEME_KEY = 'ai_collection_theme_v1';

  const COLOR_PALETTE = [
    '#10a37f', '#d97757', '#4285f4', '#4d6bfe',
    '#7c3aed', '#20808d', '#5865f2', '#ff5500',
    '#e11d48', '#059669', '#0ea5e9', '#f59e0b',
    '#64748b', '#000000'
  ];

  // 預設 AI 模型資料
  const DEFAULT_MODELS = [
    { id: 'chatgpt',   name: 'ChatGPT',    tagline: '全能對話助理',   url: 'https://chat.openai.com',     color: '#10a37f' },
    { id: 'claude',    name: 'Claude',     tagline: '長文推理高手',   url: 'https://claude.ai',           color: '#d97757' },
    { id: 'gemini',    name: 'Gemini',     tagline: 'Google 智慧助手', url: 'https://gemini.google.com',   color: '#4285f4' },
    { id: 'deepseek',  name: 'DeepSeek',   tagline: '開源程式利器',   url: 'https://chat.deepseek.com',   color: '#4d6bfe' },
    { id: 'grok',      name: 'Grok',       tagline: '幽默即時問答',   url: 'https://grok.com',            color: '#7c3aed' },
    { id: 'perplexity', name: 'Perplexity', tagline: '聯網搜尋引擎',  url: 'https://www.perplexity.ai',   color: '#20808d' },
    { id: 'midjourney', name: 'Midjourney', tagline: 'AI 繪圖神器',   url: 'https://www.midjourney.com',  color: '#5865f2' },
    { id: 'suno',      name: 'Suno',       tagline: '一鍵生成音樂',   url: 'https://suno.com',            color: '#ff5500' },
    { id: 'copilot',   name: 'Copilot',    tagline: '微軟辦公助手',   url: 'https://copilot.microsoft.com', color: '#0078d4' },
    { id: 'kimi',      name: 'Kimi',       tagline: '超長文本閱讀',   url: 'https://kimi.moonshot.cn',    color: '#6c5ce7' },
    { id: 'qwen',      name: '通義千問',    tagline: '阿里中文模型',   url: 'https://tongyi.aliyun.com',   color: '#615ced' },
    { id: 'doubao',    name: '豆包',        tagline: '字節智能夥伴',   url: 'https://www.doubao.com',      color: '#3b82f6' }
  ];

  /* ============================================================
     2. 狀態
  ============================================================ */
  let models = [];          // 模型資料陣列
  let editMode = false;     // 是否編輯模式
  let searchQuery = '';     // 搜尋關鍵字
  let editingId = null;     // 正在編輯的模型 id（null 表示新增）
  let selectedColor = COLOR_PALETTE[0];
  let draggedId = null;     // 拖拽中的 id

  /* ============================================================
     3. DOM 參照
  ============================================================ */
  const gridEl = document.getElementById('grid');
  const editToggle = document.getElementById('editToggle');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const searchInput = document.getElementById('searchInput');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modelForm = document.getElementById('modelForm');
  const fieldName = document.getElementById('fieldName');
  const fieldTagline = document.getElementById('fieldTagline');
  const fieldUrl = document.getElementById('fieldUrl');
  const fieldIcon = document.getElementById('fieldIcon');
  const colorPicker = document.getElementById('colorPicker');
  const cancelBtn = document.getElementById('cancelBtn');
  const fileInput = document.getElementById('fileInput');

  /* ============================================================
     4. 工具函式
  ============================================================ */
  function generateId() {
    return 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // 取得 favicon (使用 Google 服務)
  function getFaviconUrl(url) {
    try {
      const domain = new URL(url).hostname;
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
    } catch (e) {
      return '';
    }
  }

  // 從顏色產生一個漸層背景
  function colorToGradient(color) {
    return `linear-gradient(135deg, ${color} 0%, ${shadeColor(color, -25)} 100%)`;
  }

  // 顏色加深/變亮
  function shadeColor(hex, percent) {
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    r = Math.max(0, Math.min(255, r + Math.round(255 * percent / 100)));
    g = Math.max(0, Math.min(255, g + Math.round(255 * percent / 100)));
    b = Math.max(0, Math.min(255, b + Math.round(255 * percent / 100)));
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  // 文字顏色（深淺對比）
  function getContrastText(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? '#1a1a1a' : '#ffffff';
  }

  // 顯示 toast 提示
  function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    toast.style.cssText = `
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--accent); color: white; padding: 0.75rem 1.5rem;
      border-radius: 40px; font-size: 0.85rem; font-weight: 500; z-index: 999;
      box-shadow: 0 10px 30px -8px rgba(0,0,0,0.4); opacity: 0;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      pointer-events: none; font-family: inherit;
    `;
    document.body.appendChild(toast);
    requestAnimationFrame(() => {
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
    });
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(-50%) translateY(20px)';
      setTimeout(() => toast.remove(), 300);
    }, 2200);
  }

  /* ============================================================
     5. 資料儲存
  ============================================================ */
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (Array.isArray(data) && data.length > 0) {
          models = data;
        } else {
          models = JSON.parse(JSON.stringify(DEFAULT_MODELS));
        }
      } else {
        models = JSON.parse(JSON.stringify(DEFAULT_MODELS));
      }
    } catch (e) {
      models = JSON.parse(JSON.stringify(DEFAULT_MODELS));
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(models));
    } catch (e) {
      console.warn('儲存失敗', e);
    }
  }

  function loadTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'dark') {
      document.body.dataset.theme = 'dark';
      themeIcon.textContent = '☀️';
    } else {
      document.body.dataset.theme = 'light';
      themeIcon.textContent = '🌙';
    }
  }

  function toggleTheme() {
    const isDark = document.body.dataset.theme === 'dark';
    document.body.dataset.theme = isDark ? 'light' : 'dark';
    themeIcon.textContent = isDark ? '🌙' : '☀️';
    localStorage.setItem(THEME_KEY, isDark ? 'light' : 'dark');
  }

  /* ============================================================
     6. 渲染
  ============================================================ */
  function getFilteredModels() {
    if (!searchQuery.trim()) return models;
    const q = searchQuery.trim().toLowerCase();
    return models.filter(m =>
      m.name.toLowerCase().includes(q) ||
      (m.tagline || '').toLowerCase().includes(q)
    );
  }

  function render() {
    const list = getFilteredModels();
    gridEl.innerHTML = '';

    if (list.length === 0 && searchQuery) {
      // 搜尋無結果
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `<span class="emoji">🔍</span><p>沒有找到符合「${escapeHtml(searchQuery)}」的模型</p>`;
      gridEl.appendChild(empty);
      return;
    }

    if (list.length === 0 && models.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `<span class="emoji">✨</span><p>還沒有任何模型，點擊下方按鈕新增</p>`;
      gridEl.appendChild(empty);
    }

    list.forEach((model, idx) => {
      gridEl.appendChild(createCard(model, idx));
    });

    // 新增卡片按鈕（僅在非搜尋狀態顯示，避免混淆）
    if (!searchQuery.trim()) {
      gridEl.appendChild(createAddCard());
    }
  }

  function createCard(model, index) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = model.id;
    card.style.setProperty('--brand-color', model.color || '#888');
    card.style.animationDelay = Math.min(index * 30, 300) + 'ms';

    // 圖標來源：使用者指定 > favicon
    const iconSrc = model.icon || getFaviconUrl(model.url);
    const bg = model.color ? colorToGradient(model.color) : 'linear-gradient(135deg,#6b7280,#374151)';
    const textColor = model.color ? getContrastText(model.color) : '#fff';

    // 編輯模式的操作按鈕
    const actions = document.createElement('div');
    actions.className = 'card-edit-actions';
    actions.innerHTML = `
      <button type="button" data-action="edit" title="編輯">✎</button>
      <button type="button" class="danger" data-action="delete" title="刪除">✕</button>
    `;

    // 圖標
    const icon = document.createElement('div');
    icon.className = 'card-icon';
    icon.style.background = bg;
    icon.style.color = textColor;
    if (iconSrc) {
      const img = document.createElement('img');
      img.src = iconSrc;
      img.alt = model.name;
      img.loading = 'lazy';
      img.onerror = function() {
        // 圖片載入失敗時用文字代替
        this.remove();
        icon.textContent = model.name.charAt(0).toUpperCase();
        icon.style.background = bg;
        icon.style.color = textColor;
      };
      icon.appendChild(img);
    } else {
      icon.textContent = model.name.charAt(0).toUpperCase();
    }

    // 名稱
    const name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = model.name;
    name.title = model.name;

    // 短句描述
    const tagline = document.createElement('div');
    tagline.className = 'card-tagline';
    tagline.textContent = model.tagline || '';
    tagline.title = model.tagline || '';

    card.appendChild(actions);
    card.appendChild(icon);
    card.appendChild(name);
    card.appendChild(tagline);

    // ---- 事件 ----
    // 編輯模式下不開啟連結，只處理按鈕
    card.addEventListener('click', (e) => {
      if (editMode) return;
      // 開啟連結
      window.open(model.url, '_blank', 'noopener,noreferrer');
    });

    // 編輯/刪除按鈕
    actions.addEventListener('click', (e) => {
      e.stopPropagation();
      const btn = e.target.closest('button');
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === 'edit') openEditModal(model.id);
      if (action === 'delete') deleteModel(model.id);
    });

    // 拖拽（僅編輯模式）
    if (editMode) {
      card.draggable = true;

      card.addEventListener('dragstart', (e) => {
        draggedId = model.id;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        // Firefox 需要 setData
        try { e.dataTransfer.setData('text/plain', model.id); } catch (_) {}
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        document.querySelectorAll('.card.drag-over').forEach(c => c.classList.remove('drag-over'));
        draggedId = null;
      });

      card.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (draggedId && draggedId !== model.id) {
          card.classList.add('drag-over');
        }
      });

      card.addEventListener('dragleave', () => {
        card.classList.remove('drag-over');
      });

      card.addEventListener('drop', (e) => {
        e.preventDefault();
        card.classList.remove('drag-over');
        if (!draggedId || draggedId === model.id) return;
        reorderModels(draggedId, model.id);
      });
    }

    return card;
  }

  function createAddCard() {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'add-card';
    btn.innerHTML = `<span class="plus">+</span><span>新增模型</span>`;
    btn.addEventListener('click', () => openAddModal());
    return btn;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  /* ============================================================
     7. 操作：排序、刪除
  ============================================================ */
  function reorderModels(fromId, toId) {
    const fromIdx = models.findIndex(m => m.id === fromId);
    const toIdx = models.findIndex(m => m.id === toId);
    if (fromIdx === -1 || toIdx === -1) return;

    const [moved] = models.splice(fromIdx, 1);
    models.splice(toIdx, 0, moved);

    saveData();
    render();
    showToast('已更新排序');
  }

  function deleteModel(id) {
    const model = models.find(m => m.id === id);
    if (!model) return;
    if (!confirm(`確定要刪除「${model.name}」嗎？`)) return;
    models = models.filter(m => m.id !== id);
    saveData();
    render();
    showToast('已刪除');
  }

  /* ============================================================
     8. 模態框
  ============================================================ */
  function renderColorPicker() {
    colorPicker.innerHTML = '';
    COLOR_PALETTE.forEach(color => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch' + (color === selectedColor ? ' selected' : '');
      swatch.style.background = color;
      swatch.dataset.color = color;
      swatch.addEventListener('click', () => {
        selectedColor = color;
        renderColorPicker();
      });
      colorPicker.appendChild(swatch);
    });
  }

  function openAddModal() {
    editingId = null;
    modalTitle.textContent = '新增模型';
    fieldName.value = '';
    fieldTagline.value = '';
    fieldUrl.value = '';
    fieldIcon.value = '';
    selectedColor = COLOR_PALETTE[0];
    renderColorPicker();
    showModal();
  }

  function openEditModal(id) {
    const model = models.find(m => m.id === id);
    if (!model) return;
    editingId = id;
    modalTitle.textContent = '編輯模型';
    fieldName.value = model.name || '';
    fieldTagline.value = model.tagline || '';
    fieldUrl.value = model.url || '';
    fieldIcon.value = model.icon || '';
    selectedColor = model.color || COLOR_PALETTE[0];
    renderColorPicker();
    showModal();
  }

  function showModal() {
    modalOverlay.classList.add('show');
    setTimeout(() => fieldName.focus(), 100);
  }

  function hideModal() {
    modalOverlay.classList.remove('show');
    editingId = null;
  }

  function handleSubmit(e) {
    e.preventDefault();

    const name = fieldName.value.trim();
    const tagline = fieldTagline.value.trim();
    const url = fieldUrl.value.trim();
    const icon = fieldIcon.value.trim();

    if (!name || !tagline || !url) return;

    // 驗證 URL
    try { new URL(url); } catch (err) {
      alert('請輸入有效的網址（需包含 http:// 或 https://）');
      return;
    }

    if (editingId) {
      // 編輯
      const model = models.find(m => m.id === editingId);
      if (model) {
        model.name = name;
        model.tagline = tagline;
        model.url = url;
        model.icon = icon;
        model.color = selectedColor;
      }
      showToast('已更新');
    } else {
      // 新增
      models.push({
        id: generateId(),
        name, tagline, url, icon,
        color: selectedColor
      });
      showToast('已新增');
    }

    saveData();
    render();
    hideModal();
  }

  /* ============================================================
     9. 匯入 / 匯出
  ============================================================ */
  function exportData() {
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      models: models
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ai-collection-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('已匯出 JSON 檔案');
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        let imported = null;

        // 支援兩種格式：直接陣列 或 { version, models }
        if (Array.isArray(data)) {
          imported = data;
        } else if (data && Array.isArray(data.models)) {
          imported = data.models;
        }

        if (!imported || imported.length === 0) {
          alert('檔案格式不正確，找不到模型資料');
          return;
        }

        // 驗證並清理
        const valid = imported.filter(m =>
          m && typeof m.name === 'string' && typeof m.url === 'string'
        ).map(m => ({
          id: m.id || generateId(),
          name: m.name,
          tagline: m.tagline || '',
          url: m.url,
          icon: m.icon || '',
          color: m.color || COLOR_PALETTE[0]
        }));

        if (valid.length === 0) {
          alert('檔案中沒有有效的模型資料');
          return;
        }

        const mode = confirm(
          `匯入 ${valid.length} 個模型。\n\n` +
          `按「確定」= 取代現有資料\n` +
          `按「取消」= 合併到現有資料`
        );

        if (mode) {
          models = valid;
        } else {
          // 合併：避免 id 重複
          const existingIds = new Set(models.map(m => m.id));
          valid.forEach(m => {
            if (existingIds.has(m.id)) m.id = generateId();
            models.push(m);
          });
        }

        saveData();
        render();
        showToast(`已匯入 ${valid.length} 個模型`);
      } catch (err) {
        alert('讀取檔案失敗：' + err.message);
      }
    };
    reader.readAsText(file);
  }

  /* ============================================================
     10. 事件綁定
  ============================================================ */
  function bindEvents() {
    // 編輯模式切換
    editToggle.addEventListener('click', () => {
      editMode = !editMode;
      document.body.classList.toggle('edit-mode', editMode);
      editToggle.classList.toggle('active-mode', editMode);
      render();
    });

    // 主題
    themeToggle.addEventListener('click', toggleTheme);

    // 匯出
    exportBtn.addEventListener('click', exportData);

    // 匯入
    importBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) importData(file);
      fileInput.value = ''; // 允許重複匯入同一檔案
    });

    // 搜尋（防抖）
    let searchTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchQuery = e.target.value;
        render();
      }, 120);
    });

    // 模態框
    modelForm.addEventListener('submit', handleSubmit);
    cancelBtn.addEventListener('click', hideModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) hideModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalOverlay.classList.contains('show')) {
        hideModal();
      }
    });

    // 拖拽到網格空白區域時不觸發 drop
    gridEl.addEventListener('dragover', (e) => e.preventDefault());
    gridEl.addEventListener('drop', (e) => {
      // 如果沒有落在卡片上，忽略
      e.preventDefault();
    });
  }

  /* ============================================================
     11. 初始化
  ============================================================ */
  function init() {
    loadTheme();
    loadData();
    bindEvents();
    render();
  }

  init();
})();
</script>
</body>
</html>
